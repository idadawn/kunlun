<!DOCTYPE html>
<html lang="zh-CN" data-app-area="staff">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>员工端小程序 | 绿麒麟·水站会员管理系统</title>
<link rel="stylesheet" href="/assets/brand.css">
<script src="/assets/route-config.js"></script>
<script src="/assets/app-router.js"></script>
<script src="/assets/brand.js"></script>
<script src="/assets/live-api.js"></script>
<script src="/assets/membership.js"></script>
<script src="/assets/plan-picker.js"></script>
<style>
.h5-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:76px}
.h5-page{display:none}.h5-page.active{display:block}
.h5-hero{background:var(--grad-card);color:#fff;padding:12px 18px 46px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.h5-hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
.h5-status{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.h5-greeting small{display:block;color:rgba(255,255,255,.8);font-size:11.5px;letter-spacing:.8px}
.h5-greeting h2{margin:3px 0 0;font-size:20px;letter-spacing:.5px}
.hero-bell{border:0;background:rgba(255,255,255,.15);color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;position:relative}
.hero-bell .dot{position:absolute;right:7px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--orange-500)}
.shift-card{margin-top:12px;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.14);font-size:11.5px;color:#fff;position:relative;z-index:1}
.shift-card em{font-style:normal;color:#def7f1;font-weight:600;letter-spacing:1px}

.h5-body{padding:14px 16px}
.h5-body.overlap{margin-top:-32px;position:relative;z-index:2}
.h5-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.work-numbers{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.work-number b{display:block;font-family:var(--font-num);font-size:22px;color:var(--ink)}
.work-number small{color:var(--muted);font-size:11.5px}

.h5-section-head{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
.h5-section-head h3{margin:0;font-size:14.5px;color:var(--ink)}
.h5-section-head a,.h5-section-head span{font-size:12px;color:var(--muted)}

.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick-item{border:1px solid var(--line-soft);background:#fbfdfc;border-radius:13px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);transition:.15s}
.quick-item:active{transform:scale(.97);background:var(--brand-50)}
.quick-icon{width:42px;height:42px;border-radius:12px;background:var(--brand-50);color:var(--brand-600);display:grid;place-items:center}
.quick-icon.aqua{background:var(--aqua-50);color:var(--aqua-600)}
.quick-icon.gold{background:var(--gold-50);color:var(--gold-600)}
.quick-icon.orange{background:var(--orange-50);color:var(--orange-500)}
.quick-icon.violet{background:var(--violet-50);color:var(--violet-500)}

.h5-order{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:11px;box-shadow:var(--shadow-sm)}
.h5-order-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.h5-order-top b{color:var(--ink);font-size:14.5px}
.h5-order-top small{color:var(--muted);font-size:11.5px;margin-left:8px}
.h5-product{display:flex;align-items:center;gap:11px;padding:10px 11px;background:var(--bg);border-radius:12px}
.product-icon{width:38px;height:38px;border-radius:10px;background:var(--brand-50);color:var(--brand-600);display:grid;place-items:center;flex:none}
.h5-product b{display:block;color:var(--ink);font-size:13.5px}
.h5-product small{color:var(--muted);font-size:11.5px}
.h5-address{display:flex;align-items:center;gap:6px;color:var(--text);font-size:12.5px;margin-top:9px}
.h5-address .icon{width:15px;height:15px;color:var(--brand-500)}
.h5-order-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft)}
.h5-order-foot small{color:var(--muted);font-size:11.5px;font-family:var(--font-num)}

.mobile-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
.mobile-top h2{margin:0;font-size:19px;color:var(--ink)}
.choice-row{display:flex;gap:7px}
.choice-pill{flex:1;height:34px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:12.5px;color:var(--muted);font-weight:500}
.choice-pill.active{background:var(--brand-500);border-color:var(--brand-500);color:#fff;font-weight:600}

.field-search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:0 12px;height:40px;color:var(--muted)}
.field-search input{border:0;outline:0;background:none;width:100%;font-size:13px;color:var(--text)}
.member-cell{display:flex;align-items:center;gap:10px}
.member-avatar{width:38px;height:38px;border-radius:11px;background:var(--brand-50);color:var(--brand-600);display:grid;place-items:center;font-weight:700;flex:none}
.member-cell b{display:block;color:var(--ink);font-size:14px}
.member-cell small{color:var(--muted);font-size:11.5px}
.wallet-sub{display:flex;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
.wallet-sub b{color:var(--ink);font-family:var(--font-num)}

.profile-list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.profile-row{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line-soft);font-size:13.5px;color:var(--ink);cursor:pointer}
.profile-row:last-child{border-bottom:0}
.profile-row .icon:first-child{color:var(--brand-600)}
.profile-row span{flex:1}
.profile-row small{color:var(--muted);font-size:12px}

.h5-bottom{position:absolute;left:0;right:0;bottom:0;height:64px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}
.h5-nav{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
.h5-nav.active{color:var(--brand-600);font-weight:600}

/* Phone internal bottom sheet */
.sheet-mask{position:absolute;inset:0;background:rgba(6,40,31,.48);z-index:40;display:none;align-items:flex-end}
.sheet-mask.open{display:flex}
.sheet{width:100%;max-height:84%;background:#fff;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -12px 32px rgba(6,40,31,.2)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font-size:15.5px;color:var(--ink)}
.sheet-close{border:0;background:var(--line-soft);width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.sheet-body{padding:14px 18px;overflow-y:auto;flex:1}
.sheet-foot{display:flex;gap:10px;padding:12px 18px 18px;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1;height:42px}

.selected-member{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--brand-50);border-radius:12px;margin-bottom:12px}
.selected-member .text-btn{margin-left:auto;border:0;background:none;color:var(--brand-600);font-size:12px;font-weight:600}
.plan-choice{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.plan-opt{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.plan-opt.active{border-color:var(--brand-500);background:var(--brand-50);box-shadow:inset 0 0 0 1px var(--brand-500)}
.plan-opt b{display:block;color:var(--ink);font-size:13.5px}
.plan-opt small{color:var(--muted);font-size:11.5px}
.plan-opt .price{font-family:var(--font-num);font-weight:700;font-size:16px;color:var(--brand-600)}
.qty-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.qty-control{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;height:34px}
.qty-control button{width:34px;height:100%;border:0;background:var(--line-soft);font-size:15px}
.qty-control input{width:44px;height:100%;border:0;text-align:center;font-weight:700}
.summary-box{background:#f8fbf9;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:12px}
.summary-box div{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
.summary-box b{color:var(--ink)}
.hide{display:none!important}
</style>
</head>
<body>


<div class="mobile-showcase">


  <div class="phone">

    <div class="phone-screen">

      <div class="wx-navbar">
        <div class="wx-title">绿麒麟水站·员工工作台 </div>

      </div>

      <div class="h5-scroll" id="staffScroll">
        <!-- 1. 工作台 -->
        <div id="staff-home" class="h5-page active">
          <div class="h5-hero">
            <div class="h5-status">
              <div class="h5-greeting">
                <small>绿麒麟水站｜小分子团弱碱活性水</small>
                <h2>小林，早上好</h2>
              </div>
              <button class="hero-bell" onclick="staffNav('orders')"><svg class="icon"><use href="#i-bell"/></svg><i class="dot"></i></button>
            </div>
            <div class="shift-card"><span>早班当值 · 王师傅 / 小林</span><em>鲜活每一滴，好水到你家</em></div>
          </div>

          <div class="h5-body overlap">
            <div class="h5-card">
              <div class="work-numbers">
                <div class="work-number"><b id="staffPending">6</b><small>待履约水单</small></div>
                <div class="work-number"><b>18</b><small>今日已送达</small></div>
                <div class="work-number"><b>¥680</b><small>今日经手收款</small></div>
              </div>
            </div>

            <div class="h5-section-head"><h3>快捷办理</h3><span>先选会员 · 独立记账</span></div>
            <div class="h5-card">
              <div class="quick-grid">
                <button class="quick-item" onclick="openSheet('recharge')"><span class="quick-icon"><svg class="icon lg"><use href="#i-wallet"/></svg></span>水费充值</button>
                <button class="quick-item" onclick="openSheet('deposit')"><span class="quick-icon gold"><svg class="icon lg"><use href="#i-deposit"/></svg></span>交/退押金</button>
                <button class="quick-item" onclick="openSheet('order')"><span class="quick-icon aqua"><svg class="icon lg"><use href="#i-order"/></svg></span>代开水单</button>
                <button class="quick-item" onclick="openSheet('pickupCode')"><span class="quick-icon orange"><svg class="icon lg"><use href="#i-qr"/></svg></span>自提核销</button>
                <button class="quick-item" onclick="openSheet('container')"><span class="quick-icon violet"><svg class="icon lg"><use href="#i-box"/></svg></span>登记领还</button>
                <button class="quick-item" onclick="openSheet('newMember')"><span class="quick-icon"><svg class="icon lg"><use href="#i-users"/></svg></span>新建会员</button>
              </div>
            </div>

            <div class="h5-section-head"><h3>待办水单</h3><a href="/staff/orders" data-route-page="orders">全部 6 单 ›</a></div>




          </div>
        </div>

        <!-- 2. 水单 -->
        <div id="staff-orders" class="h5-page">
          <div class="mobile-top"><h2>水单履约</h2><button class="btn sm" onclick="KunlunLive.refreshPage()"><svg class="icon sm"><use href="#i-refresh"/></svg>刷新</button></div>
          <div class="h5-body"><p class="membership-note">正在加载…</p></div>
        </div>

        <!-- 3. 会员 -->
        <div id="staff-members" class="h5-page">
          <div class="mobile-top"><h2>会员查询与办理</h2><button class="btn primary sm" onclick="openSheet('newMember')"><svg class="icon sm"><use href="#i-plus"/></svg>新建</button></div>
          <div class="h5-body">
            <label class="field-search" style="margin-bottom:12px"><svg class="icon"><use href="#i-search"/></svg><input placeholder="输入姓名、手机号或会员编号" oninput="filterStaffMembers(this.value)"></label>
            <div class="h5-section-head"><h3>常用会员</h3><span>点击快速办理业务</span></div>
            <div id="staffMemberList"><p>正在加载…</p></div>
          </div>
        </div>

        <!-- 4. 我的 -->
        <div id="staff-profile" class="h5-page">
          <div class="mobile-top"><h2>我的工作台</h2><span class="tag green">当班中</span></div>
          <div class="h5-body">
            <div class="h5-card" style="display:flex;align-items:center;gap:12px">
              <div class="member-avatar" style="width:48px;height:48px;font-size:17px">林</div>
              <div><b style="font-size:16px;color:var(--ink)">林晓峰（小林）</b><div style="color:var(--muted);font-size:12px;margin-top:2px">工号 YG0012 · 店员兼送水员</div></div>
            </div>

            <div class="profile-list">


              <div class="profile-row"><svg class="icon"><use href="#i-store"/></svg><span>所属水站</span><small>绿麒麟水站</small></div>

            </div>
          </div>
        </div>
      </div>

      <!-- 手机内底部抽屉 -->
      <div class="sheet-mask" id="sheetMask" onclick="if(event.target===this)closeSheet()">
        <div class="sheet">
          <div class="sheet-head"><h3 id="sheetTitle">业务办理</h3><button class="sheet-close" onclick="closeSheet()"><svg class="icon sm"><use href="#i-close"/></svg></button></div>
          <div class="sheet-body" id="sheetBody"></div>
          <div class="sheet-foot" id="sheetFoot"></div>
        </div>
      </div>

      <nav class="h5-bottom">
        <button class="h5-nav active" data-staff="home" onclick="staffNav('home')"><svg class="icon"><use href="#i-home"/></svg>工作台</button>
        <button class="h5-nav" data-staff="orders" onclick="staffNav('orders')"><svg class="icon"><use href="#i-order"/></svg>水单</button>
        <button class="h5-nav" data-staff="members" onclick="staffNav('members')"><svg class="icon"><use href="#i-users"/></svg>会员</button>
        <button class="h5-nav" data-staff="profile" onclick="staffNav('profile')"><svg class="icon"><use href="#i-user"/></svg>我的</button>
      </nav>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
document.addEventListener('DOMContentLoaded',()=>$$('.gq-logo').forEach(e=>e.innerHTML=GQ.logoSvg));
function staffNav(page){
  $$('.h5-page').forEach(p=>p.classList.toggle('active',p.id===`staff-${page}`));
  $$('[data-staff]').forEach(b=>b.classList.toggle('active',b.dataset.staff===page));$$('[data-top-staff]').forEach(b=>b.classList.toggle('active',b.dataset.topStaff===page));
  $('#staffScroll').scrollTop=0;
}
function setSheet(title,body,foot=''){
  $('#sheetTitle').textContent=title;
  $('#sheetBody').innerHTML=body;
  $('#sheetFoot').innerHTML=foot;
  $('#sheetFoot').style.display=foot?'flex':'none';
  $('#sheetMask').classList.add('open');
}
function closeSheet(){$('#sheetMask').classList.remove('open')}
function filterStaffMembers(v){
  $$('#staffMemberList .h5-card').forEach(c=>c.classList.toggle('hide',!c.textContent.toLowerCase().includes(v.toLowerCase())));
}
function openSheet(){GQ.toast('请稍候，正在加载业务操作');}

</script>
</body>
</html>
