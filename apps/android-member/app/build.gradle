plugins { id 'com.android.application' }

def repositoryRoot = rootProject.projectDir.toPath().resolve('../..').normalize().toFile()
def webAssets = layout.buildDirectory.dir('generated/assets/www')
def releaseOrigin = providers.gradleProperty('memberReleaseOrigin').getOrElse('https://kunlun.idalee.cn')
def releaseUri = new URI(releaseOrigin)
if (releaseUri.scheme != 'https' || !releaseUri.host || releaseUri.userInfo || releaseUri.query || releaseUri.fragment || (releaseUri.path && releaseUri.path != '/')) {
    throw new GradleException('memberReleaseOrigin must be an HTTPS origin without credentials, path, query or fragment')
}

// Release signing stays out of the repository: -PkunlunSigning=<file> (or KUNLUN_ANDROID_SIGNING) names a properties
// file with storeFile, storePassword, keyAlias and keyPassword; a relative storeFile is read next to that file.
// Without it the release APK is left unsigned, as in CI.
def signingPath = providers.gradleProperty('kunlunSigning').orElse(providers.environmentVariable('KUNLUN_ANDROID_SIGNING')).getOrNull()
def releaseSigning = null
if (signingPath) {
    def signingFile = file(signingPath)
    if (!signingFile.isFile()) throw new GradleException("kunlunSigning: $signingPath is not a file")
    releaseSigning = new Properties()
    signingFile.withInputStream { releaseSigning.load(it) }
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !releaseSigning.getProperty(it) }
    if (missing) throw new GradleException("kunlunSigning: $signingPath has no ${missing.join(', ')}")
    def store = new File(releaseSigning.getProperty('storeFile'))
    releaseSigning.setProperty('storeFile', (store.absolute ? store : new File(signingFile.parentFile, store.path)).path)
}

android {
    namespace 'cn.idalee.kunlun.member'
    compileSdk 36
    defaultConfig {
        applicationId 'cn.idalee.kunlun.member'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (releaseSigning) {
            release {
                storeFile file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
                // v1 as well as v2, for installers and app-market tools that still look for the older signature.
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            buildConfigField 'String', 'MEMBER_ORIGIN', '"http://127.0.0.1:5188"'
        }
        release {
            buildConfigField 'String', 'MEMBER_ORIGIN', '"' + releaseOrigin.replaceAll('/$', '') + '"'
            if (releaseSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/assets')
}

def checkWeb = tasks.register('checkMemberWeb', Exec) {
    workingDir repositoryRoot
    commandLine 'pnpm', '--filter', '@kunlun/mobile-h5', 'typecheck'
}
def bundleWeb = tasks.register('bundleMemberWeb', Exec) {
    dependsOn checkWeb
    workingDir repositoryRoot
    inputs.files(fileTree(new File(repositoryRoot, 'apps/mobile-h5')) { exclude 'node_modules/**', 'dist/**' })
    inputs.files(fileTree(new File(repositoryRoot, 'packages')) { exclude '**/node_modules/**', '**/dist/**', '**/.turbo/**' })
    inputs.dir new File(repositoryRoot, 'scripts')
    inputs.file new File(repositoryRoot, 'pnpm-lock.yaml')
    outputs.dir webAssets
    // The same H5 bundle as the staff app; MemberUrls only lets the member pages open.
    commandLine 'pnpm', '--filter', '@kunlun/mobile-h5', 'exec', 'vite', 'build', '--outDir', webAssets.get().asFile.absolutePath, '--emptyOutDir'
}
tasks.named('preBuild').configure { dependsOn bundleWeb }

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is a stub on the JVM; the tests parse update replies with the real one.
    testImplementation 'org.json:json:20250517'
}
