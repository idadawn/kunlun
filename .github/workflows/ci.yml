name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kunlun
          POSTGRES_DB: kunlun_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kunlun -d kunlun_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KUNLUN_TEST_DATABASE_URL: Host=localhost;Port=5432;Database=kunlun_test;Username=kunlun
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:pages
      - run: pnpm test:poster
      - run: pnpm test:web
      - run: pnpm typecheck
      - run: dotnet test Kunlun.slnx --configuration Release
