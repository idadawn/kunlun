# Serve apps/admin-pc/dist from /srv/kunlun. All three clients are included.
server {
    listen 80;
    server_name _;
    root /srv/kunlun;
    index index.html;

    location /api/ { proxy_pass http://127.0.0.1:5188; proxy_set_header Host $host; }
    location = /healthz { proxy_pass http://127.0.0.1:5188; }
    location = / { return 308 /admin$is_args$args; }
    location = /index.html { return 308 /admin$is_args$args; }
    location = /admin.html { return 308 /admin$is_args$args; }
    location = /staff.html { return 308 /staff$is_args$args; }
    location = /member.html { return 308 /member$is_args$args; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri/index.html $uri =404; }
}
