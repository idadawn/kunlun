# Serves the two React builds: apps/admin-pc/dist at /srv/kunlun/admin-pc and apps/mini-app/dist at /srv/kunlun/mini-app.
# Page routes mirror packages/shared/src/routes.ts; scripts/web-routes.test.mjs keeps them in sync. Anything else is 404.
server {
    listen 80;
    server_name _;

    location /api/ { proxy_pass http://127.0.0.1:5188; proxy_set_header Host $host; }
    location = /healthz { proxy_pass http://127.0.0.1:5188; }
    location = / { return 308 /admin$is_args$args; }

    location /static/admin/ { root /srv/kunlun/admin-pc; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /static/h5/ { root /srv/kunlun/mini-app; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }

    location ~ ^/admin(?:/(?:dashboard|members|orders|recharges|deposits|inventory|assets|products|plans|coupons|staff-accounts|settings|deposit-settings|finance))?/?$ {
        root /srv/kunlun/admin-pc; try_files /index.html =404; add_header Cache-Control "no-cache";
    }
    location ~ ^/(?:staff(?:/(?:home|order|orders|members|profile))?|member(?:/(?:home|order|orders|assets|records|profile|addresses))?)/?$ {
        root /srv/kunlun/mini-app; try_files /index.html =404; add_header Cache-Control "no-cache";
    }

    location / { return 404; }
}
